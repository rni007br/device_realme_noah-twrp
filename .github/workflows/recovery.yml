name: Recovery Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev libgl1-mesa-dev unzip jq

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo

    - name: Sync TWRP Source
      run: |
        export PATH=~/bin:$PATH
        mkdir twrp
        cd twrp
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11
        repo sync -j$(nproc) --force-sync

    - name: Clone Device Tree
      run: |
        cd twrp
        git clone https://github.com/imjyotiraditya/device_realme_noah-twrp -b android-10 device/realme/noah

    - name: Building Recovery
      run: |
        export PATH=~/bin:$PATH
        cd twrp
        # বিল্ড এনভায়রনমেন্ট লোড করা
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        
        # ডিভাইস কনফিগারেশন সিলেক্ট করা
        lunch omni_noah-eng
        
        # বিল্ড শুরু করা (mka ব্যবহার করে)
        mka recoveryimage -j$(nproc)

    - name: Upload Recovery
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Noah-Recovery
        path: twrp/out/target/product/noah/recovery.img
